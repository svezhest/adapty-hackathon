<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Company · New feedback</title>
<script src="./api.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&amp;display=swap" rel="stylesheet">
<link href="./tokens.css" rel="stylesheet">
<style>
body{margin:0;background:var(--bg)}
*{box-sizing:border-box}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-2)}
button,input,select,textarea{font-family:Inter,system-ui,-apple-system,sans-serif}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--ink-2)}
.inp{height:40px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px}
.inp:focus,.ta:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-ring)}
.ta{min-height:170px;padding:12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;line-height:1.55;resize:vertical}
.bad{border-color:var(--bad)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;height:40px;padding:3px;border-radius:var(--r-ctl);background:var(--subtle)}
.thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:4px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line);transition:transform .28s cubic-bezier(.22,.9,.3,1)}
.seg.at-email .thumb{transform:translateX(100%)}
.seg button{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;border:0;background:transparent;color:var(--ink-2);font-size:14px;font-weight:500;cursor:pointer;transition:color .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.thumb,.seg button{transition:none}}
.primary{height:40px;padding:0 20px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);font-size:14px;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.primary:hover{background:var(--accent)}
.done{animation:in .24s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="min-height: 100vh; background:var(--haze); color: var(--ink); font-family: Inter, system-ui, -apple-system, sans-serif; font-size:14px; line-height: 1.5; -webkit-font-smoothing: antialiased">
<header style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px">
<a href="Main.dc.html" style="font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size:24px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink)">Company</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px; flex: 1 1 auto; min-width: 0">
<a href="Main.dc.html" class="nl">Incoming</a>
<a href="Chat.dc.html" class="nl">Chat</a>
<a href="Settings.dc.html" class="nl">Agent settings</a>
<a href="Analyze.dc.html" class="nl">Analyze</a>
<a href="Impact.dc.html" class="nl">Impact</a>
<a href="Catalogue.dc.html" class="nl">Screens</a>
</nav>
<span class="btn nf" aria-current="page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New feedback</span>
</header>

<main style="max-width: 1200px; margin: 0 auto; padding: 20px 24px 80px; display: flex; flex-direction: column; gap: 18px">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-size:14px; font-weight: 500; color: var(--ink-2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Incoming</a>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 class="sr">New feedback</h1>
</div>

<sc-if value="{{ editing }}" hint-placeholder-val="{{ true }}">
<form class="card" onSubmit="{{ submit }}" style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
<label class="lbl"><span class="sr">What the user wrote</span>
<textarea class="{{ msgCls }}" placeholder="Paste the message as it came in" value="{{ msg }}" onChange="{{ onMsg }}"></textarea>
<sc-if value="{{ msgErr }}"><span style="font-size:13px; color: var(--bad)">Add the user's message.</span></sc-if>
</label>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px">
<label class="lbl"><span class="sr">From</span><input class="inp" type="text" placeholder="User id or email" value="{{ from }}" onChange="{{ onFrom }}"></label>
<div class="lbl"><span id="src-l" class="sr">Source</span>
<div class="{{ segCls }}" role="radiogroup" aria-labelledby="src-l">
<span class="thumb" aria-hidden="true"></span>
<button type="button" role="radio" aria-checked="{{ isForm }}" class="{{ formCls }}" onClick="{{ toForm }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14v14H5z"></path><path d="M9 10h6M9 14h6"></path></svg>Form</button>
<button type="button" role="radio" aria-checked="{{ isEmail }}" class="{{ emailCls }}" onClick="{{ toEmail }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4z"></path><path d="M4 7l8 6 8-6"></path></svg>Email</button>
</div>
</div>
</div>
<label class="lbl"><span class="sr">Subject</span><input class="inp" type="text" placeholder="Short summary, optional" value="{{ subject }}" onChange="{{ onSubject }}"></label>
<div style="display: flex; align-items: center; gap: 16px; padding-top: 4px">
<button type="submit" class="primary">Send to Incoming</button>
<a href="Main.dc.html" style="font-size:14px; font-weight: 500; color: var(--ink-3)">Cancel</a>
</div>
<sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; font-size:14px; font-weight: 500; color: var(--bad)">{{ error }}</p></sc-if>
</form>
</sc-if>

<sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
<section class="card done" style="padding: 24px; display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; display: inline-flex; align-items: center; gap: 8px; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size:20px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"></path></svg>Added to Incoming</p>
<p style="margin: 0; color: var(--ink-2)">The agent is triaging it now.</p>
<div style="display: flex; gap: 18px; margin-top: 6px"><a href="Main.dc.html" style="font-weight: 500">Open Incoming</a><button type="button" onClick="{{ again }}" style="background: none; border: 0; padding: 0; color: var(--accent); font-size:14px; font-weight: 500; cursor: pointer">Add another</button></div>
</section>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var src = s.src || 'form';
    var msg = s.msg || '';
    var err = !!s.tried && !msg.trim();
    return {
      editing: !s.sent, sent: !!s.sent,
      msg: msg, from: s.from || '', subject: s.subject || '',
      msgErr: err, msgCls: err ? 'ta bad' : 'ta',
      onMsg: function (e) { self.setState({ msg: e.target.value }); },
      onFrom: function (e) { self.setState({ from: e.target.value }); },
      onSubject: function (e) { self.setState({ subject: e.target.value }); },
      segCls: src === 'email' ? 'seg at-email' : 'seg',
      isForm: String(src === 'form'), isEmail: String(src === 'email'),
      formCls: src === 'form' ? 'on' : '', emailCls: src === 'email' ? 'on' : '',
      toForm: function () { self.setState({ src: 'form' }); },
      toEmail: function () { self.setState({ src: 'email' }); },
      hasError: !!s.error, error: s.error || '',
      submit: function (e) {
        e.preventDefault();
        if (!msg.trim()) { self.setState({ tried: true }); return; }
        if (API.mock) { self.setState({ sent: true }); return; }
        if (self.sending) return;
        // POST /feedback; then the new ticket's page. "From" is an email when it has an @, else a user id.
        var from = (s.from || '').trim();
        var body = { text: msg.trim(), source: src };
        if (from.indexOf('@') >= 0) body.email = from; else if (from) body.customer_user_id = from;
        if ((s.subject || '').trim()) body.subject = s.subject.trim();
        self.sending = true;
        self.setState({ error: null });
        API.post('/feedback', body).then(function (r) {
          location.href = 'Ticket.dc.html?id=' + encodeURIComponent(r.ticket_id);
        }, function (err) {
          self.sending = false;
          self.setState({ error: 'Not sent: ' + err.message + '. Try again.' });
        });
      },
      again: function () { self.setState({ sent: false, tried: false, msg: '', from: '', subject: '' }); }
    };
  }
}
</script>
</body>
</html>
